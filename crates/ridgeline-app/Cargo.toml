[package]
name = "ridgeline-app"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "ridgeline"
path = "src/main.rs"

[dependencies]
ridgeline-core = { path = "../ridgeline-core" }
gpui-kit = { workspace = true }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std", "ansi"] }
open = "5"
anyhow = "1"
dirs = "6"

[build-dependencies]
# Same version gpui already pulls in; used only for Windows targets.
embed-resource = "3.0.12"
